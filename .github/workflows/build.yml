name: Build Real Lab VST3

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Collect VST3 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundles = Get-ChildItem -Path build -Recurse -Filter "*.vst3" -Directory
          if (-not $bundles) { throw "No .vst3 bundle found" }
          foreach ($b in $bundles) { Copy-Item -Recurse -Force $b.FullName -Destination dist }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RealLab-VST3-Windows
          path: dist/
          if-no-files-found: error
